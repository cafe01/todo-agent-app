name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Server checks
        working-directory: server
        run: |
          dart pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-infos
          dart test
      - name: Web checks
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build native plugin marketplace
        run: python3 scripts/build.py
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Exercise relocated native package with MCP and browser
        working-directory: web
        run: |
          version=$(node -p "require('../plugin/plugin.json').version")
          TODO_APP_BINARY="$GITHUB_WORKSPACE/dist/todo-agent-app-$version-${{ matrix.platform }}/plugins/todo-agent-app/bin/todo_agent_app" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: web/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts
      - name: Publish tested bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --title "To Do Agent App $TAG" --notes "Experimental native local plugin. Download the archive for your platform and verify its SHA-256 sidecar. See the repository README for installation and current validation limits."
